# Runs the tests on Linux and Windows (TODO 6.1, 6.31). The "test" job uses SQLite, no database server needed; the "test-mariadb"
# job runs the same database tests on real MariaDB 10.6, 10.11 and 11.4 and on MySQL 8.0 (TODO 6.66, 6.85).
# The two actions are pinned to a commit (the release is in the comment), not to a tag: a tag can be moved to different code by
# whoever controls the action's repository, a commit cannot (TODO 6.51). Dependabot's github-actions entry proposes new commits.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
# A new push cancels the older run of the same branch or pull request (TODO 6.51).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # verify = the tests plus the JaCoCo coverage report (TODO 6.59).
      - name: Run tests
        run: ./mvnw -B clean verify
        shell: bash
      # Digits written through the default locale come out as Arabic-Indic digits on some PCs (TODO 6.62): run the suite once more
      # under ar_SA so such a bug fails here and not at a shop. The first run above pins en_US (see pom.xml).
      - name: Run tests under an Arabic locale
        if: matrix.os == 'ubuntu-latest'
        run: ./mvnw -B test -Dtest.locale.language=ar -Dtest.locale.country=SA
        shell: bash
      # The measured line coverage per package, in the run's summary, so the floors in pom.xml can be set from a real report (TODO 6.81).
      - name: Show line coverage per package
        if: always() && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            {
              echo "### Line coverage per package"
              echo "| package | lines covered | lines | % |"
              echo "| --- | ---: | ---: | ---: |"
              awk -F, 'NR>1 { c[$2]+=$9; m[$2]+=$8 } END { for (p in c) { t=c[p]+m[p]; printf "| %s | %d | %d | %.1f |\n", p, c[p], t, (t? 100*c[p]/t : 0) } }' target/site/jacoco/jacoco.csv | sort
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always() && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco
          if-no-files-found: ignore
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports
          if-no-files-found: ignore
      # A broken jlink or packaging setting (TODO 6.15) then shows up on every push, not on release day.
      - name: Package (no tests)
        if: matrix.os == 'ubuntu-latest'
        run: ./mvnw -B -DskipTests package
        shell: bash
  # TODO 6.79: SpotBugs with findsecbugs, report only (it never fails the build yet; docs/STATIC-ANALYSIS.md says when it should).
  # Written without being able to run it: the first run is the test.
  bugs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run SpotBugs
        run: ./mvnw -B -Pbugs compile spotbugs:spotbugs
        shell: bash
      - name: Upload the SpotBugs report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: spotbugs-report
          path: target/spotbugsXml.xml
          if-no-files-found: warn

  # The MariaDB code (MariaDbSchema, MariaDbMigrations, SqlDialect, the data rules, the importer) is only exercised against a real server
  # here (TODO 6.66). The command is the one in docs/DATABASE.md section 10. The database name must end in _test: the support class drops
  # every table in it first and refuses any other name. Host, port and user below are the defaults it expects. The tables carry their own
  # utf8mb4 settings, so the image's default character set does not matter. Tests about SQLite files skip themselves (requireSqlite).
  # A matrix (TODO 6.85): the oldest MariaDB still supported, the one the shop is told to install, the newest long-term release, and
  # MySQL 8.0, which the README and docs/DATABASE.md also name. The entries differ only in the image, the health check and the name of
  # the command-line client inside the image (MariaDB 11 no longer ships "mysql"). Both kinds of image accept the MYSQL_* variables.
  # MySQL is "experimental" (continue-on-error) until it has been green once: the SQL was only read for MySQL, never run (TODO 6.85).
  # Remove that line from the entry when the job is green, so a red MySQL run then blocks like the others.
  test-mariadb:
    name: test-${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mariadb-10.6
            image: mariadb:10.6
            client: mariadb
            native_password: false
            experimental: false
            health: healthcheck.sh --connect --innodb_initialized
          - name: mariadb-10.11
            image: mariadb:10.11
            client: mariadb
            native_password: false
            experimental: false
            health: healthcheck.sh --connect --innodb_initialized
          - name: mariadb-11.4
            image: mariadb:11.4
            client: mariadb
            native_password: false
            experimental: false
            health: healthcheck.sh --connect --innodb_initialized
          - name: mysql-8.0
            image: mysql:8.0
            client: mysql
            native_password: true
            experimental: true
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot-test-password --silent
    services:
      db:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: lunavera_test
          MYSQL_USER: lunavera_test
          MYSQL_PASSWORD: test-password
          MYSQL_ROOT_PASSWORD: root-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # MySQL, and a MariaDB server with this mode, refuse a query that selects a column it does not group by (error 1055); the
      # default MariaDB mode does not (TODO 6.47). Switching it on for the whole server makes every report query prove itself here.
      # The tests open their connections after this step, so each one starts in the new mode. The mode is added to the default
      # list, not put in its place. (mariadb-admin is not on the runner, so the statement goes through the image: docker exec.)
      - name: Turn ONLY_FULL_GROUP_BY on in the test server
        run: |
          container=$(docker ps --filter "ancestor=${{ matrix.image }}" --format "{{.ID}}" | head -n 1)
          docker exec "$container" ${{ matrix.client }} -uroot -proot-test-password -e "SET GLOBAL sql_mode = CONCAT(@@GLOBAL.sql_mode, ',ONLY_FULL_GROUP_BY'); SELECT @@GLOBAL.sql_mode;"
      # MySQL 8 makes new users use caching_sha2_password, which the driver only accepts over TLS or with a key exchange the tests do not
      # set up; the shop's own users are made by hand in XAMPP/phpMyAdmin, so the test user is switched to the classic plugin.
      - name: Give the MySQL test user the classic password plugin
        if: matrix.native_password
        run: |
          container=$(docker ps --filter "ancestor=${{ matrix.image }}" --format "{{.ID}}" | head -n 1)
          docker exec "$container" ${{ matrix.client }} -uroot -proot-test-password -e "ALTER USER 'lunavera_test'@'%' IDENTIFIED WITH mysql_native_password BY 'test-password';"
      - name: Run tests on ${{ matrix.name }}
        run: ./mvnw -B test -Dlunavera.test.db=mariadb -Dlunavera.test.db.password=test-password
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: surefire-reports-${{ matrix.name }}
          path: target/surefire-reports
          if-no-files-found: ignore
