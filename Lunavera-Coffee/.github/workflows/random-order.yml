# TODO 6.77: the tests in a random order, once a week and on demand, to find the ones that share state. REPORT ONLY: it never blocks
# anything (continue-on-error) and the ordered run in ci.yml stays the gate. Make this one a gate only after it has been green for a month.
#
# Every database test class in a run shares one database (TestDatabaseSupport), and the program has static state (Session, I18n, the
# AppClock override, ShopRules): a test that leaves something changed, or counts rows another class wrote, passes in the fixed order
# and fails in another. The run prints its seed; a failure is replayed with the same seed:
#     ./mvnw -B test -Dsurefire.runOrder=random -Dsurefire.runOrder.random.seed=<the seed from the summary>
# (Run it by hand from the Actions tab with "Run workflow", optionally giving a seed to replay.)
# Written without being able to run it: the first run is the test. Pinned to the same commits as ci.yml (TODO 6.51).
name: Random test order
on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      seed:
        description: 'Seed to replay (leave empty for a new random one)'
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: random-order-${{ github.ref }}
  cancel-in-progress: true
jobs:
  random:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run the tests in random order
        shell: bash
        env:
          SEED: ${{ github.event.inputs.seed }}
        run: |
          set -o pipefail
          args="-Dsurefire.runOrder=random"
          if [ -n "$SEED" ]; then args="$args -Dsurefire.runOrder.random.seed=$SEED"; fi
          # no JaCoCo here: it only slows the run down, and the ordered run measures coverage
          ./mvnw -B test $args -Djacoco.skip=true 2>&1 | tee random-run.log
      - name: Write the seed and the failures into the summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Random test order"
            seed=$(grep -o 'runOrder.random.seed=[-0-9]*' random-run.log | head -n 1 | cut -d= -f2)
            if [ -n "$seed" ]; then
              echo "Seed: \`$seed\`"
              echo
              echo "Replay it: \`./mvnw -B test -Dsurefire.runOrder=random -Dsurefire.runOrder.random.seed=$seed\`"
            else
              echo "The seed was not found in the log (surefire prints it on the line that says the tests run in random order): open the log."
            fi
            echo
            echo "Tests that failed or errored (they may share state: run the class alone, then after the class that ran before it):"
            echo '```'
            grep -E '^\[ERROR\] +[A-Za-z0-9_.]+(Test|Check)\.[A-Za-z0-9_]+' random-run.log | sort -u | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the log and the test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: random-order-reports
          path: |
            random-run.log
            target/surefire-reports
          if-no-files-found: ignore
